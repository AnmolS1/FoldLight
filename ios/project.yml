name: FoldLight

options:
  bundleIdPrefix: dev.ponderance.foldlight
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    # Fallback build number. The per-target postBuildScripts below OVERRIDE this at
    # build/archive time with the git commit count (auto-increment). This literal is
    # only used if git is unavailable; keep it ≥ the last App Store Connect upload.
    CURRENT_PROJECT_VERSION: "24"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G2KBQH7KWT   # personal team "Anmol Saxena" — survives `xcodegen generate`

targets:

  # ── Shared framework: models, HA client, theme, settings, presets, intents ──
  FoldKit:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FoldKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.foldlight.kit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # ── Minimal multiplatform host app (color/preset editor + Settings + Panel) ──
  FoldLight:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # The widget AppIntents are compiled into the app too so the app bundle's
      # AppIntents metadata contains them. macOS resolves an interactive widget
      # intent against the APP bundle (chronod: "no metadata for ToggleLightIntent
      # in dev.ponderance.foldlight"), unlike iOS which resolves it in the extension.
      - path: SharedIntents
    dependencies:
      - target: FoldKit
      - target: FoldLightWidgets
    postBuildScripts:
      - name: Set build number from git commit count
        basedOnDependencyAnalysis: false
        script: |
          # Auto build number at build/archive time: git commit count (monotonic),
          # floored so it never regresses. Degrades safely — if git or the plist is
          # unavailable it leaves $(CURRENT_PROJECT_VERSION) from project.yml intact.
          n=$(git -C "$PROJECT_DIR" rev-list --count HEAD 2>/dev/null || echo 0)
          [ "$n" -lt 24 ] && n=24
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $n" "$plist" && echo "build number -> $n"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.foldlight
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FoldLight.entitlements
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        # Both iOS (Frameworks next to exec) and macOS (../Frameworks) rpaths,
        # since this is one multiplatform target.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"
          - "@loader_path/Frameworks"
          - "@loader_path/../Frameworks"

  # ── WidgetKit extension: interactive widgets + iOS-18 controls + launchers ──
  FoldLightWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
      # Same intent sources as the app; the widget's Button(intent:) uses this copy
      # and its metadata is extracted into the appex (needed on iOS).
      - path: SharedIntents
    dependencies:
      - target: FoldKit
    postBuildScripts:
      - name: Set build number from git commit count
        basedOnDependencyAnalysis: false
        script: |
          # Auto build number at build/archive time: git commit count (monotonic),
          # floored so it never regresses. Degrades safely — if git or the plist is
          # unavailable it leaves $(CURRENT_PROJECT_VERSION) from project.yml intact.
          n=$(git -C "$PROJECT_DIR" rev-list --count HEAD 2>/dev/null || echo 0)
          [ "$n" -lt 24 ] && n=24
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $n" "$plist" && echo "build number -> $n"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.foldlight.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/FoldLightWidgets.entitlements
        # The widget extension links FoldKit but the framework is embedded in the
        # PARENT app bundle, not the appex. It must find it via rpath or it crashes
        # at launch (dyld "Library not loaded: @rpath/FoldKit.framework") and the
        # widget renders blank — which is exactly why the buttons did nothing. The
        # appex nests deeper than the app, so the search paths differ per platform:
        #   iOS:   App.app/PlugIns/W.appex/W          → ../../Frameworks
        #   macOS: App.app/Contents/PlugIns/W.appex/Contents/MacOS/W → ../../../../Frameworks
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
          - "@executable_path/../../../../Frameworks"
          - "@loader_path/Frameworks"
          - "@loader_path/../../Frameworks"
          - "@loader_path/../../../../Frameworks"

  # ── Unit tests for FoldKit (HA decode, brightness, URL norm, presets) ──
  FoldKitTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FoldKitTests
    dependencies:
      - target: FoldKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.foldlight.kittests
        GENERATE_INFOPLIST_FILE: YES

  # ── UI tests: capture largest-Dynamic-Type screenshots for the a11y gate (iOS) ──
  FoldLightUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: FoldLightUITests
    dependencies:
      - target: FoldLight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.foldlight.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FoldLight

schemes:
  FoldLight:
    build:
      targets:
        FoldLight: all
    run:
      config: Debug
    test:
      targets:
        - FoldKitTests
        - FoldLightUITests
  FoldKit:
    build:
      targets:
        FoldKit: all
    test:
      targets:
        - FoldKitTests
