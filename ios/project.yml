name: FoldLight

options:
  bundleIdPrefix: dev.ponderance.foldlight
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G2KBQH7KWT   # personal team "Anmol Saxena" — survives `xcodegen generate`

targets:

  # ── Shared framework: models, HA client, theme, settings, presets, intents ──
  FoldKit:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FoldKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.foldlight.kit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # ── Minimal multiplatform host app (color/preset editor + Settings + Panel) ──
  FoldLight:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - target: FoldKit
      - target: FoldLightWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.foldlight
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FoldLight.entitlements
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        # Both iOS (Frameworks next to exec) and macOS (../Frameworks) rpaths,
        # since this is one multiplatform target.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"
          - "@loader_path/Frameworks"
          - "@loader_path/../Frameworks"

  # ── WidgetKit extension: interactive widgets + iOS-18 controls + launchers ──
  FoldLightWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
    dependencies:
      - target: FoldKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.foldlight.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/FoldLightWidgets.entitlements

  # ── Unit tests for FoldKit (HA decode, brightness, URL norm, presets) ──
  FoldKitTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FoldKitTests
    dependencies:
      - target: FoldKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.foldlight.kittests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FoldLight:
    build:
      targets:
        FoldLight: all
    run:
      config: Debug
    test:
      targets:
        - FoldKitTests
  FoldKit:
    build:
      targets:
        FoldKit: all
    test:
      targets:
        - FoldKitTests
